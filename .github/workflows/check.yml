name: Chercher les prix

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # toutes les 15 min ; GitHub peut décaler ou sauter des passages,
                                    # d'où la relance par l'horloge Cloudflare quand la clé GitHub est configurée
  workflow_dispatch:        # bouton « Run workflow » pour lancer un passage tout de suite

permissions:
  contents: write           # uniquement pour le fichier .keepalive (voir dernière étape)

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checker/requirements.txt

      - run: pip install -r checker/requirements.txt

      - name: Adresse du relais
        id: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | python3 -c "import sys, json; print((json.load(sys.stdin).get('result') or {}).get('subdomain', ''))")
            if [ -z "$sub" ]; then
              echo "::error::Sous-domaine workers.dev introuvable : lance d'abord « Déployer le bot »."
              exit 1
            fi
            WORKER_URL="https://flight-radar.$sub.workers.dev"
          fi
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Passage du moteur
        env:
          WORKER_URL: ${{ steps.relay.outputs.url }}
          API_KEY: ${{ secrets.API_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GOOGLE_MAX_REQUESTS: ${{ vars.GOOGLE_MAX_REQUESTS || '10' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m checker.main

      # GitHub met en pause les tâches planifiées d'un dépôt public sans commit depuis 60 jours.
      # On écrit donc un petit fichier tous les 45 jours pour garder le moteur actif.
      - name: Garder le planning actif
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3888000 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
            git config user.name "flight-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Maintien du planning automatique"
            git push
          fi
