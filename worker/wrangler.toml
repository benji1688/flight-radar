name = "flight-radar"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# L'identifiant est rempli automatiquement par le workflow « Déployer le bot ».
[[kv_namespaces]]
binding = "STATE"
id = "__KV_ID__"

# Relance du moteur toutes les 15 min (utilisée seulement si GH_DISPATCH_TOKEN est configuré).
[triggers]
crons = ["7,22,37,52 * * * *"]
